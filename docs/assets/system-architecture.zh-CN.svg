<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="840" viewBox="0 0 1160 840" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1160" height="840" fill="#ffffff"/>

  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">具身 GUI 智能体 · 系统架构</text>
  <text x="40" y="64" font-size="11" fill="#6b7280">感知 → 决策 → 执行 → 反馈闭环 ｜ 真机在环 Hardware-in-the-loop ｜ 配套：01 研究方案书</text>

  <!-- ============ 决策层 ============ -->
  <rect x="60" y="90" width="1040" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="76" y="112" font-size="12" font-weight="700" fill="#1d4ed8">① 决策层 · Agent Core</text>

  <g>
    <rect x="80" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="155" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">任务定义</text>
    <text x="155" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">初始状态 / 成功断言</text>
    <text x="155" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">最长步数 / 随机化</text>

    <rect x="248" y="130" width="165" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="330" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">LLM 规划器</text>
    <text x="330" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">子目标分解</text>
    <text x="330" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">失败回退策略</text>

    <rect x="431" y="130" width="160" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="511" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">VLM 视觉定位</text>
    <text x="511" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">元素框 + 语义标签</text>
    <text x="511" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">OCR 兜底</text>

    <rect x="609" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="684" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">记忆 / 上下文</text>
    <text x="684" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">页面栈 / 已试动作</text>
    <text x="684" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">失败原因库</text>

    <rect x="777" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="852" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">验证器</text>
    <text x="852" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">截图比对 / 断言</text>
    <text x="852" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">结构相似度</text>

    <rect x="945" y="130" width="140" height="105" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="1015" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">力判别器</text>
    <text x="1015" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">AUC ≥ 0.85</text>
    <text x="1015" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">判定延迟 ≤100ms</text>
  </g>

  <!-- ============ 感知层 ============ -->
  <rect x="60" y="300" width="480" height="180" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="76" y="322" font-size="12" font-weight="700" fill="#15803d">② 感知层</text>

  <rect x="80" y="340" width="205" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="182" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">USB 摄像头 1080p</text>
  <text x="182" y="382" font-size="9" text-anchor="middle" fill="#4b5563">手动对焦 / 固定补光</text>

  <rect x="300" y="340" width="220" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="410" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">FSR 力传感器 ≥200Hz</text>
  <text x="410" y="382" font-size="9" text-anchor="middle" fill="#4b5563">峰值 / 冲量 / 回弹时间</text>

  <rect x="80" y="405" width="205" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="182" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">光标 / 元素检测</text>
  <text x="182" y="447" font-size="9" text-anchor="middle" fill="#4b5563">HID 视觉伺服用</text>

  <rect x="300" y="405" width="220" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="410" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">状态估计</text>
  <text x="410" y="447" font-size="9" text-anchor="middle" fill="#4b5563">页面栈 / 轴位置 / 连接</text>

  <!-- ============ 执行层 ============ -->
  <rect x="620" y="300" width="480" height="180" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="636" y="322" font-size="12" font-weight="700" fill="#c2410c">③ 执行层 · 原语 + 仲裁</text>

  <rect x="640" y="340" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="745" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">HID 通道 · ESP32</text>
  <text x="745" y="382" font-size="9" text-anchor="middle" fill="#4b5563">键码 / 滚轮 / 相对位移</text>

  <rect x="870" y="340" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="975" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">机械臂 · GRBL XY</text>
  <text x="975" y="382" font-size="9" text-anchor="middle" fill="#4b5563">G 代码 + 电磁铁点击头</text>

  <rect x="640" y="405" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="745" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">软件注入基线</text>
  <text x="745" y="447" font-size="9" text-anchor="middle" fill="#4b5563">ADB / 无障碍（对照组）</text>

  <rect x="870" y="405" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="975" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">仲裁器 + 安全监视</text>
  <text x="975" y="447" font-size="9" text-anchor="middle" fill="#4b5563">限力 / 急停 / 防压屏</text>

  <!-- ============ 被测手机 ============ -->
  <rect x="340" y="530" width="480" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="580" y="565" font-size="13" text-anchor="middle" font-weight="700" fill="#1e3a8a">被测手机（夹具固定，屏幕朝上）</text>
  <text x="580" y="588" font-size="10" text-anchor="middle" fill="#1e40af">触摸层 · 系统输入栈 · 蓝牙 HID host · 被测 App</text>
  <text x="580" y="610" font-size="9.5" text-anchor="middle" fill="#3b82f6">输入语义差异：真触摸 = TOOL_TYPE_FINGER ／ HID = TOOL_TYPE_MOUSE</text>

  <!-- ============ 标定 & 坐标系 ============ -->
  <rect x="60" y="680" width="480" height="90" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="76" y="702" font-size="11.5" font-weight="700" fill="#854d0e">④ 标定模块（离线 + 在线）</text>
  <text x="76" y="724" font-size="9.5" fill="#713f12">单应矩阵 H（像素→机械 mm）· 触头偏置 tool offset</text>
  <text x="76" y="742" font-size="9.5" fill="#713f12">视觉伺服增益 · 每 30min 基准点校验 · 超差自动重标</text>
  <text x="76" y="760" font-size="9.5" fill="#713f12">目标：CalibErr ≤ 0.5mm，换机重标 ≤ 10min</text>

  <rect x="620" y="680" width="480" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="636" y="702" font-size="11.5" font-weight="700" fill="#5b21b6">⑤ 三套坐标系</text>
  <text x="636" y="724" font-size="9.5" fill="#4c1d95">像素坐标（图像）→ 机械坐标（mm，绝对，可标定）</text>
  <text x="636" y="742" font-size="9.5" fill="#4c1d95">HID 相对位移（无绝对坐标，靠视觉伺服收敛）</text>
  <text x="636" y="760" font-size="9.5" fill="#4c1d95">映射链：截图 → 单应 H → 机械 mm → G 代码</text>

  <!-- ============ 连线 ============ -->
  <!-- 感知 → 决策 -->
  <line x1="320" y1="300" x2="320" y2="262" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="330" y="285" font-size="9.5" fill="#374151">视觉 + 力信号</text>
  <!-- 决策 → 执行 -->
  <line x1="880" y1="260" x2="880" y2="298" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="890" y="285" font-size="9.5" fill="#374151">动作指令 / 仲裁结果</text>
  <!-- 执行 → 手机 -->
  <line x1="745" y1="480" x2="745" y2="528" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="700" y="510" font-size="9.5" fill="#374151">触头</text>
  <line x1="975" y1="480" x2="975" y2="528" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="984" y="510" font-size="9.5" fill="#374151">蓝牙</text>
  <!-- 手机 → 感知（图像/力） -->
  <line x1="352" y1="530" x2="300" y2="482" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="300" y="512" font-size="9.5" fill="#15803d">图像 / 接触力</text>
  <!-- 标定 → 感知 -->
  <line x1="300" y1="680" x2="300" y2="482" stroke="#ca8a04" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#ar)"/>
  <!-- 标定 → 执行 -->
  <line x1="880" y1="680" x2="880" y2="482" stroke="#ca8a04" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#ar)"/>
  <!-- 力反馈回决策 -->
  <line x1="1015" y1="235" x2="1015" y2="252" stroke="#ca8a04" stroke-width="1" stroke-dasharray="2 3" opacity="0"/>
  <path d="M1092,190 C1120,190 1120,290 1092,290" fill="none" stroke="#9ca3af" stroke-width="0"/>

  <!-- 闭环标注 -->
  <path d="M600,640 C600,660 560,665 520,665" fill="none" stroke="#9ca3af" stroke-width="0"/>
  <text x="600" y="668" font-size="10.5" fill="#6b7280" font-style="italic">⟲ observe → decide → act → verify 循环（每步 ≤1.5s）</text>

  <!-- 图例 -->
  <line x1="60" y1="800" x2="100" y2="800" stroke="#374151" stroke-width="1.4"/>
  <text x="108" y="804" font-size="9.5" fill="#4b5563">控制流</text>
  <line x1="180" y1="800" x2="220" y2="800" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="228" y="804" font-size="9.5" fill="#4b5563">数据 / 无线</text>
  <line x1="320" y1="800" x2="360" y2="800" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="368" y="804" font-size="9.5" fill="#4b5563">标定约束</text>
  <text x="470" y="804" font-size="9.5" fill="#6b7280">注：黄色框为本文新增模块（力判别器 / 标定 / 仲裁），其余为已有组件</text>
</svg>
