<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="840" viewBox="0 0 1160 840" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1160" height="840" fill="#ffffff"/>

  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">Embodied GUI Agent — System Architecture</text>
  <text x="40" y="64" font-size="11" fill="#6b7280">Perceive → Decide → Act → Verify loop | hardware-in-the-loop | see docs/research-proposal.md</text>

  <!-- DECISION LAYER -->
  <rect x="60" y="90" width="1040" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="76" y="112" font-size="12" font-weight="700" fill="#1d4ed8">1  DECISION LAYER · AGENT CORE</text>

  <g>
    <rect x="80" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="155" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">Task spec</text>
    <text x="155" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">initial state / asserts</text>
    <text x="155" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">max steps / seeds</text>

    <rect x="248" y="130" width="165" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="330" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">LLM planner</text>
    <text x="330" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">subgoal decomposition</text>
    <text x="330" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">fallback policy</text>

    <rect x="431" y="130" width="160" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="511" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">VLM grounding</text>
    <text x="511" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">element boxes + labels</text>
    <text x="511" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">OCR fallback</text>

    <rect x="609" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="684" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">Memory</text>
    <text x="684" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">page stack / tried acts</text>
    <text x="684" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">failure causes</text>

    <rect x="777" y="130" width="150" height="105" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="852" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">Verifier</text>
    <text x="852" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">screenshot diff</text>
    <text x="852" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">structural similarity</text>

    <rect x="945" y="130" width="140" height="105" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="1015" y="155" font-size="11.5" text-anchor="middle" font-weight="700" fill="#111827">Force classifier</text>
    <text x="1015" y="175" font-size="9.5" text-anchor="middle" fill="#4b5563">AUC ≥ 0.85</text>
    <text x="1015" y="192" font-size="9.5" text-anchor="middle" fill="#4b5563">latency ≤ 100 ms</text>
  </g>

  <!-- PERCEPTION LAYER -->
  <rect x="60" y="300" width="480" height="180" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="76" y="322" font-size="12" font-weight="700" fill="#15803d">2  PERCEPTION LAYER</text>

  <rect x="80" y="340" width="205" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="182" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">USB camera 1080p</text>
  <text x="182" y="382" font-size="9" text-anchor="middle" fill="#4b5563">manual focus / fixed light</text>

  <rect x="300" y="340" width="220" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="410" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">FSR force sensor ≥200 Hz</text>
  <text x="410" y="382" font-size="9" text-anchor="middle" fill="#4b5563">peak / impulse / rebound time</text>

  <rect x="80" y="405" width="205" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="182" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">Cursor &amp; element detect</text>
  <text x="182" y="447" font-size="9" text-anchor="middle" fill="#4b5563">for HID visual servoing</text>

  <rect x="300" y="405" width="220" height="55" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="410" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">State estimation</text>
  <text x="410" y="447" font-size="9" text-anchor="middle" fill="#4b5563">page stack / axis / link</text>

  <!-- EXECUTION LAYER -->
  <rect x="620" y="300" width="480" height="180" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="636" y="322" font-size="12" font-weight="700" fill="#c2410c">3  EXECUTION LAYER · PRIMITIVES + ARBITRATION</text>

  <rect x="640" y="340" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="745" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">HID channel · ESP32</text>
  <text x="745" y="382" font-size="9" text-anchor="middle" fill="#4b5563">keycodes / wheel / relative</text>

  <rect x="870" y="340" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="975" y="364" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">Robot arm · GRBL XY</text>
  <text x="975" y="382" font-size="9" text-anchor="middle" fill="#4b5563">G-code + solenoid tip</text>

  <rect x="640" y="405" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="745" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">Software injection</text>
  <text x="745" y="447" font-size="9" text-anchor="middle" fill="#4b5563">ADB / a11y (control group)</text>

  <rect x="870" y="405" width="210" height="55" rx="4" fill="#ffffff" stroke="#fdba74"/>
  <text x="975" y="429" font-size="10.5" text-anchor="middle" font-weight="700" fill="#111827">Arbiter + safety monitor</text>
  <text x="975" y="447" font-size="9" text-anchor="middle" fill="#4b5563">force limit / e-stop / guard</text>

  <!-- PHONE -->
  <rect x="340" y="530" width="480" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="580" y="565" font-size="13" text-anchor="middle" font-weight="700" fill="#1e3a8a">Phone under test (fixed in fixture, screen up)</text>
  <text x="580" y="588" font-size="10" text-anchor="middle" fill="#1e40af">touch layer · input stack · BT HID host · app under test</text>
  <text x="580" y="610" font-size="9.5" text-anchor="middle" fill="#3b82f6">input semantics: real touch = TOOL_TYPE_FINGER / HID = TOOL_TYPE_MOUSE</text>

  <!-- CALIBRATION -->
  <rect x="60" y="680" width="480" height="90" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="76" y="702" font-size="11.5" font-weight="700" fill="#854d0e">4  CALIBRATION MODULE (offline + online)</text>
  <text x="76" y="724" font-size="9.5" fill="#713f12">Homography H (px → machine mm) · tool offset</text>
  <text x="76" y="742" font-size="9.5" fill="#713f12">Visual-servo gain · baseline check every 30 min · auto recalibrate</text>
  <text x="76" y="760" font-size="9.5" fill="#713f12">Targets: CalibErr ≤ 0.5 mm, recalibration ≤ 10 min</text>

  <!-- COORDINATE FRAMES -->
  <rect x="620" y="680" width="480" height="90" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="636" y="702" font-size="11.5" font-weight="700" fill="#5b21b6">5  THREE COORDINATE SYSTEMS</text>
  <text x="636" y="724" font-size="9.5" fill="#4c1d95">Pixel (image) → machine mm (absolute, calibrated)</text>
  <text x="636" y="742" font-size="9.5" fill="#4c1d95">HID relative displacement (no absolute coords → visual servoing)</text>
  <text x="636" y="760" font-size="9.5" fill="#4c1d95">Chain: frame → H → machine mm → G-code</text>

  <!-- CONNECTORS -->
  <line x1="320" y1="300" x2="320" y2="262" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="330" y="285" font-size="9.5" fill="#374151">vision + force</text>

  <line x1="880" y1="260" x2="880" y2="298" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="890" y="285" font-size="9.5" fill="#374151">action / arbitration</text>

  <line x1="745" y1="480" x2="745" y2="528" stroke="#374151" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="700" y="510" font-size="9.5" fill="#374151">stylus</text>
  <line x1="975" y1="480" x2="975" y2="528" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="984" y="510" font-size="9.5" fill="#374151">Bluetooth</text>

  <line x1="352" y1="530" x2="300" y2="482" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="296" y="512" font-size="9.5" fill="#15803d">image / force</text>

  <line x1="300" y1="680" x2="300" y2="482" stroke="#ca8a04" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#ar)"/>
  <line x1="880" y1="680" x2="880" y2="482" stroke="#ca8a04" stroke-width="1.1" stroke-dasharray="2 3" marker-end="url(#ar)"/>

  <text x="600" y="668" font-size="10.5" fill="#6b7280" font-style="italic">observe → decide → act → verify loop (≤1.5 s per step)</text>

  <!-- LEGEND -->
  <line x1="60" y1="800" x2="100" y2="800" stroke="#374151" stroke-width="1.4"/>
  <text x="108" y="804" font-size="9.5" fill="#4b5563">control flow</text>
  <line x1="200" y1="800" x2="240" y2="800" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="248" y="804" font-size="9.5" fill="#4b5563">data / wireless</text>
  <line x1="370" y1="800" x2="410" y2="800" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="418" y="804" font-size="9.5" fill="#4b5563">calibration constraint</text>
  <text x="580" y="804" font-size="9.5" fill="#6b7280">Yellow boxes are new in this work (force classifier / calibration / arbiter); the rest are existing components.</text>
</svg>
